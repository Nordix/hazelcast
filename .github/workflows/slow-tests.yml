name: slow-tests
# Covers what integration-tests.yml deliberately skips: the extensions/*
# modules (the "not-quick" reactor modules are active by default — property
# !quick — they are simply never selected by the -pl lists in that workflow),
# the failsafe *IT tests (integration-tests.yml only runs `mvn test`),
# modulepath-tests, hazelcast-it/jdk17-tests, and the SlowTest/NightlyTest
# categories that the pr-builder surefire config excludes.
on:
  workflow_dispatch:
  push:
    branches:
      - v5.2.5-est
  pull_request:
    branches:
      - v5.2.5-est

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-extensions:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        java: [ '8' ]
        architecture: [ 'x64' ]
        distribution: [ 'corretto' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          path: hazelcast

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 #6.2.0
        with:
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          distribution: ${{ matrix.distribution }}
          cache: maven

      # Keep Azure discovery auto-detection from probing IMDS on these
      # runners (429s abort client creation); same as integration-tests.yml.
      - name: Neutralize Azure IMDS discovery auto-detection
        run: sudo sed -i '/internal\.cloudapp\.net/d' /etc/resolv.conf && cat /etc/resolv.conf

      # extensions/python: Jet's jet_to_python_init.sh builds a venv and pip
      # installs the pinned protobuf==3.19.6 / grpcio==1.60.0. The runner's
      # system python3 is 3.14, for which grpcio 1.60.0 has no wheels (pip
      # falls back to a source build that dies on missing pkg_resources, run
      # 44005310169), so pin 3.12. setup-python's shim takes PATH precedence
      # for the `python3` Jet spawns, and its builds ship venv/ensurepip.
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # 5.3.0
        with:
          python-version: '3.12'

      - name: Install core (no tests)
        run: |
          cd hazelcast
          mvn install -pl hazelcast -am -DskipTests -Dcheckstyle.skip -P pr-builder -B --no-transfer-progress

      # hazelcast-3-connector, s3, and kinesis are intentionally left out:
      #  - hazelcast-3-connector: BaseHz3Test.findConnectorImplJar() matches
      #    only *-SNAPSHOT.jar and this branch versions as 5.2.5.
      #  - s3: AWS SDK 2.20.x defaults to virtual-host addressing which
      #    adobe/s3mock 2.1.15 cannot serve (pathStyleAccessEnabled fix
      #    needed in the tests).
      #  - kinesis: the tests pin localstack/localstack:0.12.3, a tag that
      #    has been removed from Docker Hub (pull 404s regardless of config).
      # -fae: one module's failure must not hide the results of the rest
      # (run 43474254199 lost hadoop/cdc-mysql/cdc-postgres/mapstore/grpc/
      # protobuf/python to fail-fast after kinesis).
      # api.version=1.44: Testcontainers 1.17.6 vs the runner's Docker Engine.
      - name: Test extensions
        run: |
          cd hazelcast
          mvn verify -fae -P pr-builder,parallelTest -B --no-transfer-progress \
            -pl extensions/avro,extensions/cdc-debezium,extensions/cdc-mysql,extensions/cdc-postgres,extensions/csv,extensions/elasticsearch/elasticsearch-6,extensions/elasticsearch/elasticsearch-7,extensions/hadoop,extensions/grpc,extensions/kafka,extensions/mapstore,extensions/protobuf,extensions/python \
            -DtestForkCount=1C -Dapi.version=1.44 \
            -Dsurefire.rerunFailingTestsCount=2 -Dsurefire.skipAfterFailureCount=1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #7.0.2
        if: always()
        with:
          name: surefire-reports-extensions
          path: hazelcast/extensions/**/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  test-failsafe-it:
    # Runs the failsafe *IT classes (7 total) that `mvn test` never touches.
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: [ '8' ]
        architecture: [ 'x64' ]
        distribution: [ 'corretto' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          path: hazelcast

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 #6.2.0
        with:
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          distribution: ${{ matrix.distribution }}
          cache: maven

      # One lifecycle `verify`, not `package` + direct failsafe goals: the
      # NOTICE ITs (CheckSqlNoticeFileIT, run 44188926867) look for
      # META-INF/NOTICE on a URL under target/, which only exists in the
      # packaged jar — a direct failsafe:integration-test call runs against
      # target/classes, which has none for hazelcast-sql. -skipTests would
      # skip failsafe too, so surefire is neutralised with a non-matching
      # -Dtest instead. -T1 because .mvn/maven.config sets -T0.5C and the
      # modules' tests share default ports.
      # Note the failsafe.* property namespace — surefire.* names do NOT reach
      # failsafe.
      # rerunFailingTestsCount only: failsafe 2.22.2 DEADLOCKS the fork when
      # rerunFailingTestsCount and skipAfterFailureCount are both active and a
      # test fails its first attempt (reproduced locally with a flaky probe;
      # that hang, not OSGi, is what killed test-failsafe-it in runs
      # 43897701521/43945979182 at TwoPhaseIT RemoveBackupLog). surefire
      # 2.22.2 does not share the bug, so the core jobs keep both flags.
      # HazelcastOSGiIT is excluded: it is a pax-exam test that boots an OSGi
      # framework, resolves bundles from the long-dead osgi.sonatype.org
      # (5 s vs 93 s vs never-finish depending on network phase — it hangs
      # locally), and its bundle uninstall pollutes the shared fork for the
      # next class — TwoPhaseIT then hung for 4 h in run 43897701521. The
      # positive '*IT' in it.test is required: an exclusion-only pattern makes
      # failsafe fall back to default unit-test includes and re-run all 43k
      # *Test classes.
      - name: Run failsafe ITs
        run: |
          cd hazelcast
          mvn verify -pl hazelcast,hazelcast-sql -am -T1 -P pr-builder -Dcheckstyle.skip -B --no-transfer-progress \
            -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test='*IT,!HazelcastOSGiIT' -Dit.failIfNoSpecifiedTests=false -DfailIfNoTests=false \
            -Dapi.version=1.44 -Dfailsafe.rerunFailingTestsCount=2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #7.0.2
        if: always()
        with:
          name: failsafe-reports-it
          path: |
            hazelcast/hazelcast/target/failsafe-reports/
            hazelcast/hazelcast-sql/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  test-jdk17-modules:
    # modulepath-tests and hazelcast-it/jdk17-tests are only in the reactor
    # on JDK 9+/17+ respectively.
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: [ '17' ]
        architecture: [ 'x64' ]
        distribution: [ 'corretto' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          path: hazelcast

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 #6.2.0
        with:
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          distribution: ${{ matrix.distribution }}
          cache: maven

      - name: Neutralize Azure IMDS discovery auto-detection
        run: sudo sed -i '/internal\.cloudapp\.net/d' /etc/resolv.conf && cat /etc/resolv.conf

      - name: Install core (no tests)
        run: |
          cd hazelcast
          mvn install -pl hazelcast -am -DskipTests -Dcheckstyle.skip -P pr-builder -B --no-transfer-progress

      - name: Test modulepath and jdk17 modules
        run: |
          cd hazelcast
          mvn test -pl modulepath-tests,hazelcast-it/jdk17-tests -P pr-builder,parallelTest -B --no-transfer-progress \
            -DtestForkCount=1C -Dsurefire.rerunFailingTestsCount=2 -Dsurefire.skipAfterFailureCount=1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #7.0.2
        if: always()
        with:
          name: surefire-reports-jdk17-modules
          path: |
            hazelcast/modulepath-tests/target/surefire-reports/
            hazelcast/hazelcast-it/jdk17-tests/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  test-slow-nightly-core:
    # The pr-builder surefire config excludes SlowTest/NightlyTest (~240 core
    # classes / ~1,400 methods); the nightly-build profile runs exactly those.
    # Its surefire config forces parallel:none and leaves forkCount at the
    # default of 1 — these classes are not safe to run concurrently.
    # continue-on-error on purpose for the first while: this category has
    # never run in this fork's CI, so triage the report before treating the
    # job as a required check.
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    # The full pass takes ~5 h 42 m serially (run 43474254191) and GitHub
    # caps public-repo jobs at 360 min, so it is split into 3 shards that run
    # in parallel (~2 h each). Each shard keeps the nightly-build profile's
    # one-class-at-a-time semantics; only the set of classes differs.
    timeout-minutes: 350
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        java: [ '8' ]
        architecture: [ 'x64' ]
        distribution: [ 'corretto' ]
        shard: [ 0, 1, 2 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          path: hazelcast

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 #6.2.0
        with:
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          distribution: ${{ matrix.distribution }}
          cache: maven

      - name: Neutralize Azure IMDS discovery auto-detection
        run: sudo sed -i '/internal\.cloudapp\.net/d' /etc/resolv.conf && cat /etc/resolv.conf

      - name: Select this shard's test classes
        run: |
          cd hazelcast/hazelcast
          SHARDS=3
          # Classes measured at 10-25 min each in run 44106151115 (together
          # ~2 h). Spread them round-robin so no shard collects them all,
          # then deal the remaining Slow/Nightly classes out by name.
          HEAVY="BackpressureRegulatorStressTest MembershipFailureTest_withTCP \
            RingbufferAsyncAddWithBackoffStressTest RingbufferAddReadOneStressTest \
            SelectWithSelectorFix_TcpIpConnection_TransferStressTest \
            SelectNow_TcpIpConnection_TransferStressTest \
            Select_TcpIpConnection_TransferStressTest TopicStressTest"
          i=0
          MINE=""
          for c in $HEAVY; do
            [ $((i % SHARDS)) -eq ${{ matrix.shard }} ] && MINE="$MINE,$c"
            i=$((i + 1))
          done
          REST=$(grep -rlE '(SlowTest|NightlyTest)\.class' src/test/java --include='*.java' \
            | grep -vE '/jsr/|IT\.java$' | xargs -n1 basename | sed 's/\.java$//' | sort -u \
            | grep -vxE "$(echo $HEAVY | tr ' ' '|')" \
            | awk -v s=${{ matrix.shard }} -v n=$SHARDS 'NR % n == s' | paste -sd, -)
          echo "TEST_CLASSES=${MINE#,},$REST" >> "$GITHUB_ENV"
          echo "Shard ${{ matrix.shard }}: $(echo "${MINE#,},$REST" | tr ',' '\n' | grep -c .) classes"

      - name: Test slow/nightly core tests
        run: |
          cd hazelcast/hazelcast
          mvn test -P pr-builder,nightly-build -B --no-transfer-progress \
            -Dtest="$TEST_CLASSES" -Dsurefire.failIfNoSpecifiedTests=false \
            -Dapi.version=1.44 -Dsurefire.rerunFailingTestsCount=1 -Dsurefire.skipAfterFailureCount=1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #7.0.2
        if: always()
        with:
          name: surefire-reports-slow-nightly-shard${{ matrix.shard }}
          path: hazelcast/hazelcast/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
