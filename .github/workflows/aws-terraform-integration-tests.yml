name: aws-tests
on:
  workflow_dispatch:
  push:
    branches:
      - v5.2.5-est
  pull_request:
    branches:
      - v5.2.5-est

jobs:
  build:
    defaults:
      run:
        shell: bash
    env:
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID:  ${{ secrets.AWS_ACCESS_KEY_ID }}
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Nordix'
    strategy:
      matrix:
        java: [ '8' ]
        architecture: [ 'x64' ]
        distribution: [ 'corretto' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          path: hazelcast

        # SET UP JDK
      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 #6.2.0
        with:
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          distribution: ${{ matrix.distribution }}

      - run: java -version

      # BUILD HAZELCAST AWS SNAPSHOT
      - name: Build hazelcast jar
        run: |
          cd hazelcast
          mvn clean install -DskipTests -Dcheckstyle.skip
          find hazelcast/target -maxdepth 1 -name 'hazelcast-*.jar' ! -name 'hazelcast-*-*.jar' -print
          find hazelcast/target -maxdepth 1 -name 'hazelcast-*.jar' ! -name 'hazelcast-*-*.jar' -exec cp {} ~/hazelcast.jar \;

      # INSTALL TERRAFORM
      - name : Set-up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #4.0.1
        with:
          terraform_version: 1.1.8

      - name: Terraform Init
        working-directory: hazelcast/.github/terraform/aws
        run: terraform init

      - name: Terraform Apply
        working-directory: hazelcast/.github/terraform/aws
        run: terraform apply -var="hazelcast_path=~/hazelcast.jar" -auto-approve

      - name: Terraform Destroy
        if: ${{ always() }}
        working-directory: hazelcast/.github/terraform/aws
        run: terraform destroy -auto-approve
