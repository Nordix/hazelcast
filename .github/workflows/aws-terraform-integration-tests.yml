name: aws-tests
on:
  workflow_dispatch:
  push:
    branches:
      - v5.2.5-est
  pull_request:
    branches:
      - v5.2.5-est

jobs:
  build:
    defaults:
      run:
        shell: bash
    env:
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID:  ${{ secrets.AWS_ACCESS_KEY_ID }}
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Nordix'
    strategy:
      matrix:
        java: [ '8' ]
        architecture: [ 'x64' ]
        distribution: [ 'corretto' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          path: hazelcast

      # TEMPORARY DIAGNOSTIC: list Canonical AMIs in the SCP-allowlisted region (remove after verification)
      - name: Probe AWS region permissions
        continue-on-error: true
        run: |
          set +o pipefail
          echo "== Bionic filter (what main.tf searches for) =="
          aws ec2 describe-images --region eu-north-1 --owners 099720109477 \
            --filters 'Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-bionic-18.04-amd64-server-*' \
            --query 'reverse(sort_by(Images,&CreationDate))[:3].[Name,ImageId,CreationDate]' --output table
          echo "== Newest Canonical images in eu-north-1 (any series) =="
          aws ec2 describe-images --region eu-north-1 --owners 099720109477 \
            --query 'reverse(sort_by(Images,&CreationDate))[:15].[Name,ImageId]' --output table
          exit 0

        # SET UP JDK
      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 #6.2.0
        with:
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          distribution: ${{ matrix.distribution }}

      - run: java -version

      # BUILD HAZELCAST AWS SNAPSHOT
      - name: Build hazelcast jar
        run: |
          cd hazelcast
          mvn clean install -DskipTests -Dcheckstyle.skip
          find target -maxdepth 1 -name 'hazelcast-*.jar' ! -name 'hazelcast-*-*.jar' -print
          find target -maxdepth 1 -name 'hazelcast-*.jar' ! -name 'hazelcast-*-*.jar' -exec cp {} ~/hazelcast.jar \;

      # INSTALL TERRAFORM
      - name : Set-up Terraform
        uses: hashicorp/setup-terraform@v1.3.2
        with:
          terraform_version: 1.1.8

      - name: Terraform Init
        working-directory: hazelcast/.github/terraform/aws
        run: terraform init

      - name: Terraform Apply
        working-directory: hazelcast/.github/terraform/aws
        run: terraform apply -var="hazelcast_mancenter_version=latest-snapshot" -var="hazelcast_path=~/hazelcast.jar" -auto-approve

      - name: Terraform Destroy
        if: ${{ always() }}
        working-directory: hazelcast/.github/terraform/aws
        run: terraform destroy -auto-approve
