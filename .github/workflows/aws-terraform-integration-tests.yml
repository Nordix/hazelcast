name: aws-tests
on:
  workflow_dispatch:
  push:
    branches:
      - v5.2.5-est
  pull_request:
    branches:
      - v5.2.5-est

jobs:
  build:
    defaults:
      run:
        shell: bash
    env:
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID:  ${{ secrets.AWS_ACCESS_KEY_ID }}
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Nordix'
    strategy:
      matrix:
        java: [ '8' ]
        architecture: [ 'x64' ]
        distribution: [ 'corretto' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          path: hazelcast

      # TEMPORARY DIAGNOSTIC: find which regions the CI key may use (remove after SCP issue resolved)
      - name: Probe AWS region permissions
        continue-on-error: true
        run: |
          set +o pipefail
          aws sts get-caller-identity
          for r in us-east-1 us-east-2 eu-west-1 eu-west-2 eu-central-1 eu-north-1 eu-south-1 ap-south-1; do
            printf '%-14s ' "$r"
            if out=$(aws ec2 describe-images --region "$r" --owners 099720109477 \
              --filters 'Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-bionic-18.04-amd64-server-*' \
              --query 'sort_by(Images,&CreationDate)[-1].ImageId' --output text 2>&1); then
              echo "ALLOWED -> $out"
            else
              reason=$(printf '%s' "$out" | grep -o 'api error [A-Za-z]*' | head -1 || true)
              echo "DENIED -> ${reason:-unknown error}"
            fi
          done
          exit 0

        # SET UP JDK
      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 #6.2.0
        with:
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          distribution: ${{ matrix.distribution }}

      - run: java -version

      # BUILD HAZELCAST AWS SNAPSHOT
      - name: Build hazelcast jar
        run: |
          cd hazelcast
          mvn clean install -DskipTests -Dcheckstyle.skip
          find target -maxdepth 1 -name 'hazelcast-*.jar' ! -name 'hazelcast-*-*.jar' -print
          find target -maxdepth 1 -name 'hazelcast-*.jar' ! -name 'hazelcast-*-*.jar' -exec cp {} ~/hazelcast.jar \;

      # INSTALL TERRAFORM
      - name : Set-up Terraform
        uses: hashicorp/setup-terraform@v1.3.2
        with:
          terraform_version: 1.1.8

      - name: Terraform Init
        working-directory: hazelcast/.github/terraform/aws
        run: terraform init

      - name: Terraform Apply
        working-directory: hazelcast/.github/terraform/aws
        run: terraform apply -var="hazelcast_mancenter_version=latest-snapshot" -var="hazelcast_path=~/hazelcast.jar" -auto-approve

      - name: Terraform Destroy
        if: ${{ always() }}
        working-directory: hazelcast/.github/terraform/aws
        run: terraform destroy -auto-approve
