name: integration-tests
on:
  workflow_dispatch:
  push:
    branches:
      - v5.2.5-est
  pull_request:
    branches:
      - v5.2.5-est

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '11', '17' ]
        architecture: [ 'x64' ]
        distribution: [ 'adopt' ]
    steps:
      # SET UP JDK
      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 #6.2.0
        with:
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          distribution: ${{ matrix.distribution }}
          cache: maven

      - run: java -version

      # BUILD HAZELCAST SNAPSHOT
      - uses: actions/checkout@v3.0.2
        with:
          path: hazelcast

      - name: Build hazelcast jar
        run: |
          cd hazelcast
          mvn clean install -DskipTests -Dcheckstyle.skip
          echo "Hazelcast jar is: " hazelcast/target/hazelcast-*-SNAPSHOT.jar

  validate:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '11', '17' ]
        architecture: [ 'x64' ]
        distribution: [ 'adopt' ]
    steps:
      # SET UP JDK
      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 #6.2.0
        with:
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          distribution: ${{ matrix.distribution }}
          cache: maven

      - run: java -version

      # BUILD HAZELCAST SNAPSHOT
      - uses: actions/checkout@v3.0.2
        with:
          path: hazelcast

      - name: Validate hazelcast
        run : |
          cd hazelcast
          mvn clean validate

  test:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '11', '17' ]
        architecture: [ 'x64' ]
        distribution: [ 'adopt' ]
    steps:
      # SET UP JDK
      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 #6.2.0
        with:
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          distribution: ${{ matrix.distribution }}
          cache: maven

      - run: java -version

      # BUILD HAZELCAST SNAPSHOT
      - uses: actions/checkout@v3.0.2
        with:
          path: hazelcast

      - name: Test hazelcast
        run : |
          cd hazelcast
          mvn test -P pr-builder